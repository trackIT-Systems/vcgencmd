[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcgencmd"
dynamic = ["version"]
description = "Raspberry Pi VideoCore firmware telemetry (vcgencmd) via the mailbox, without the binary"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Nic McDonald", email = "nicci02@hotmail.com" },
    { name = "Jonas Höchst", email = "hoechst@trackit.systems" },
]
keywords = ["raspberrypi", "vcgencmd", "telemetry", "raspberry-pi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/trackIT-Systems/vcgencmd"
Issues = "https://github.com/trackIT-Systems/vcgencmd/issues"
Repository = "https://github.com/trackIT-Systems/vcgencmd"

[tool.setuptools]
packages = ["vcgencmd"]

[tool.setuptools.dynamic]
version = { attr = "vcgencmd.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not device'"
markers = [
    "device: needs a VideoCore mailbox device (run on a Raspberry Pi with -m device)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
